[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-model-router"
version = "0.1.0"
description = "Budget-Aware Model Routing: reproducible offline experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
model-router = "model_router.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
